<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' role='img' aria-label='ThermoTwin-F gas turbine and CCGT digital twin: station temperatures 288K to 1400K TIT, 60.7 MW net, 52.8% plant efficiency, eta_II 0.502, 54 Fortran modules, 28 unit tests'>
  <title>ThermoTwin-F — Gas Turbine / CCGT Digital Twin</title>
  <desc>CCGT thermodynamic station schematic: compressor, combustor, turbine, HRSG, steam turbine. Design-point KPIs: 60.7 MW net, 52.8% plant efficiency, second-law efficiency 0.502 ± 0.027, 28 unit tests all green.</desc>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#0b1220'/><stop offset='1' stop-color='#070c16'/>
    </linearGradient>
    <!-- arrow markers -->
    <marker id='arr' markerWidth='7' markerHeight='5' refX='7' refY='2.5' orient='auto'>
      <polygon points='0 0, 7 2.5, 0 5' fill='#4a7cbb'/>
    </marker>
    <marker id='arr-hot' markerWidth='7' markerHeight='5' refX='7' refY='2.5' orient='auto'>
      <polygon points='0 0, 7 2.5, 0 5' fill='#f97316'/>
    </marker>
    <marker id='arr-amber' markerWidth='7' markerHeight='5' refX='7' refY='2.5' orient='auto'>
      <polygon points='0 0, 7 2.5, 0 5' fill='#f6c85f'/>
    </marker>
    <marker id='arr-teal' markerWidth='7' markerHeight='5' refX='7' refY='2.5' orient='auto'>
      <polygon points='0 0, 7 2.5, 0 5' fill='#65d6c9'/>
    </marker>
    <marker id='arr-slate' markerWidth='7' markerHeight='5' refX='7' refY='2.5' orient='auto'>
      <polygon points='0 0, 7 2.5, 0 5' fill='#6b7fa8'/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width='960' height='540' fill='url(#bg)'/>

  <!-- ─── TITLE BAR ─── -->
  <rect x='24' y='14' width='912' height='36' rx='5' fill='#0d1a2e'/>
  <text x='44' y='38' font-family='monospace' font-size='12' fill='#65d6c9' font-weight='bold'>THERMOTWIN-F  ·  GAS TURBINE / CCGT DIGITAL TWIN  ·  MODERN FORTRAN 2008  ·  54 MODULES  ·  28 UNIT TESTS</text>

  <!-- ─── LEFT PANEL: CCGT STATION SCHEMATIC ─── -->
  <rect x='30' y='60' width='546' height='422' rx='4' fill='#0d1a2e'/>
  <text x='303' y='82' font-family='monospace' font-size='10' fill='#c8d8ea' text-anchor='middle' font-weight='bold'>GAS TURBINE / CCGT  ·  THERMODYNAMIC STATION ANALYSIS</text>

  <!-- ── TEMPERATURE STATION LABELS (above gas path) ── -->
  <!-- Air inlet: 288 K -->
  <text x='56' y='127' font-family='monospace' font-size='11' fill='#38bdf8' text-anchor='middle' font-weight='bold'>288 K</text>
  <text x='56' y='139' font-family='monospace' font-size='8' fill='#2a5070' text-anchor='middle'>air in</text>

  <!-- After compressor: 679 K -->
  <text x='154' y='127' font-family='monospace' font-size='11' fill='#f6c85f' text-anchor='middle' font-weight='bold'>679 K</text>
  <text x='154' y='139' font-family='monospace' font-size='8' fill='#706030' text-anchor='middle'>comp exit</text>

  <!-- TIT (after combustor): 1400 K — prominently larger -->
  <text x='268' y='120' font-family='monospace' font-size='15' fill='#ef4444' text-anchor='middle' font-weight='bold'>1400 K</text>
  <text x='268' y='134' font-family='monospace' font-size='8' fill='#804020' text-anchor='middle'>TIT</text>

  <!-- After turbine (GT exhaust): 797 K -->
  <text x='380' y='127' font-family='monospace' font-size='11' fill='#f97316' text-anchor='middle' font-weight='bold'>797 K</text>
  <text x='380' y='139' font-family='monospace' font-size='8' fill='#705028' text-anchor='middle'>GT exhaust</text>

  <!-- Stack (HRSG exit): 379 K -->
  <text x='472' y='88' font-family='monospace' font-size='10' fill='#6b7fa8' text-anchor='middle' font-weight='bold'>379 K</text>
  <text x='472' y='100' font-family='monospace' font-size='8' fill='#3a4560' text-anchor='middle'>stack</text>

  <!-- ── GAS PATH ARROWS (horizontal, y=168) ── -->
  <!-- Air in arrow -->
  <line x1='36' y1='168' x2='50' y2='168' stroke='#38bdf8' stroke-width='2.2' marker-end='url(#arr)'/>

  <!-- ── COMPRESSOR BOX ── -->
  <rect x='50' y='146' width='92' height='44' rx='3' fill='#0e1e38' stroke='#204060' stroke-width='1.5'/>
  <text x='96' y='166' font-family='monospace' font-size='9' fill='#c8d8ea' text-anchor='middle' font-weight='bold'>COMP</text>
  <text x='96' y='180' font-family='monospace' font-size='8' fill='#406080' text-anchor='middle'>PR 15</text>

  <!-- COMP → COMB arrow (warming air) -->
  <line x1='142' y1='168' x2='165' y2='168' stroke='#f6c85f' stroke-width='2.2' marker-end='url(#arr-amber)'/>

  <!-- ── COMBUSTOR BOX ── -->
  <rect x='165' y='146' width='92' height='44' rx='3' fill='#1c1004' stroke='#6b3800' stroke-width='1.5'/>
  <text x='211' y='166' font-family='monospace' font-size='9' fill='#f6c85f' text-anchor='middle' font-weight='bold'>COMB</text>
  <text x='211' y='180' font-family='monospace' font-size='8' fill='#906030' text-anchor='middle'>NASA-9 props</text>

  <!-- COMB → TURB arrow (very hot gas) -->
  <line x1='257' y1='168' x2='280' y2='168' stroke='#ef4444' stroke-width='2.5' marker-end='url(#arr-hot)'/>

  <!-- ── TURBINE BOX ── -->
  <rect x='280' y='146' width='92' height='44' rx='3' fill='#180c04' stroke='#7a3800' stroke-width='1.5'/>
  <text x='326' y='166' font-family='monospace' font-size='9' fill='#f97316' text-anchor='middle' font-weight='bold'>TURB</text>
  <text x='326' y='180' font-family='monospace' font-size='8' fill='#7a4820' text-anchor='middle'>T_ex 797 K</text>

  <!-- TURB → HRSG arrow (hot exhaust) -->
  <line x1='372' y1='168' x2='400' y2='168' stroke='#f97316' stroke-width='2.2' marker-end='url(#arr-hot)'/>

  <!-- ── HRSG BOX (tall, receives hot exhaust) ── -->
  <rect x='400' y='112' width='128' height='200' rx='3' fill='#081820' stroke='#1a4060' stroke-width='1.5'/>
  <text x='464' y='134' font-family='monospace' font-size='9' fill='#65d6c9' text-anchor='middle' font-weight='bold'>HRSG</text>
  <text x='464' y='148' font-family='monospace' font-size='8' fill='#306070' text-anchor='middle'>ε-NTU · 3-pressure</text>
  <text x='464' y='161' font-family='monospace' font-size='8' fill='#306070' text-anchor='middle'>pinch ΔT = 15 K</text>
  <!-- Horizontal zigzag heat-exchanger lines inside HRSG (decorative) -->
  <polyline points='410,178 528,178' fill='none' stroke='#1a3048' stroke-width='1'/>
  <polyline points='410,196 528,196' fill='none' stroke='#1a3048' stroke-width='1'/>
  <polyline points='410,214 528,214' fill='none' stroke='#1a3048' stroke-width='1'/>
  <polyline points='410,232 528,232' fill='none' stroke='#1a3048' stroke-width='1'/>
  <polyline points='410,250 528,250' fill='none' stroke='#1a3048' stroke-width='1'/>
  <!-- Hot gas enters from left at y=168, exits cooled toward bottom of HRSG -->
  <!-- (the left entry arrow is already drawn above) -->

  <!-- Stack exit from HRSG top: arrow going UP -->
  <line x1='464' y1='112' x2='464' y2='72' stroke='#6b7fa8' stroke-width='2' marker-end='url(#arr-slate)'/>

  <!-- ── GT SHAFT POWER LABEL ── -->
  <!-- GT drives a generator — show a short downward dashed shaft from TURB center -->
  <line x1='326' y1='190' x2='326' y2='230' stroke='#f6c85f' stroke-width='1.5' stroke-dasharray='4,3'/>
  <text x='338' y='222' font-family='monospace' font-size='9' fill='#a08030'>45.5 MW</text>
  <circle cx='326' cy='238' r='10' fill='none' stroke='#f6c85f' stroke-width='1.2'/>
  <text x='326' y='242' font-family='monospace' font-size='7' fill='#f6c85f' text-anchor='middle'>G₁</text>

  <!-- ── STEAM PATH: HRSG → Steam Turbine ── -->
  <!-- Steam exits HRSG left side at (400, 260) → left → down → ST top -->
  <line x1='400' y1='260' x2='372' y2='260' stroke='#65d6c9' stroke-width='1.8' marker-end='url(#arr-teal)'/>
  <line x1='372' y1='260' x2='372' y2='300' stroke='#65d6c9' stroke-width='1.8' marker-end='url(#arr-teal)'/>
  <text x='384' y='257' font-family='monospace' font-size='8' fill='#306060'>STEAM</text>

  <!-- ── STEAM TURBINE BOX ── -->
  <rect x='280' y='300' width='92' height='50' rx='3' fill='#06161e' stroke='#1a4860' stroke-width='1.5'/>
  <text x='326' y='320' font-family='monospace' font-size='9' fill='#65d6c9' text-anchor='middle' font-weight='bold'>STEAM TURB</text>
  <text x='326' y='334' font-family='monospace' font-size='8' fill='#2a5868' text-anchor='middle'>IAPWS-IF97</text>
  <text x='326' y='346' font-family='monospace' font-size='8' fill='#2a5868' text-anchor='middle'>15.2 MW</text>

  <!-- ST generator shaft -->
  <line x1='326' y1='350' x2='326' y2='380' stroke='#65d6c9' stroke-width='1.5' stroke-dasharray='4,3'/>
  <circle cx='326' cy='388' r='10' fill='none' stroke='#65d6c9' stroke-width='1.2'/>
  <text x='326' y='392' font-family='monospace' font-size='7' fill='#65d6c9' text-anchor='middle'>G₂</text>
  <text x='338' y='390' font-family='monospace' font-size='9' fill='#306860'>15.2 MW</text>

  <!-- Feed water return (dashed, condensate back to HRSG) -->
  <path d='M 280,325 L 175,325 L 175,245 L 400,245' fill='none' stroke='#1a3848' stroke-width='1.4' stroke-dasharray='4,3' marker-end='url(#arr-teal)'/>
  <text x='240' y='320' font-family='monospace' font-size='8' fill='#1a3848' text-anchor='middle'>feed water</text>

  <!-- ── EXERGY DESTRUCTION BAR ── -->
  <text x='42' y='416' font-family='monospace' font-size='9' fill='#2a4060'>EXERGY DESTRUCTION — COMBUSTOR DOMINANT (second-law, release 7.0):</text>
  <!-- Bar segments — qualitative, combustor clearly largest -->
  <rect x='42'  y='422' width='268' height='20' fill='#c05020' opacity='0.9'/>
  <rect x='310' y='422' width='106' height='20' fill='#f97316' opacity='0.75'/>
  <rect x='416' y='422' width='80'  height='20' fill='#2a6090' opacity='0.8'/>
  <rect x='496' y='422' width='50'  height='20' fill='#65d6c9' opacity='0.6'/>
  <rect x='546' y='422' width='18'  height='20' fill='#3a5060' opacity='0.7'/>
  <!-- Bar labels -->
  <text x='176' y='436' font-family='monospace' font-size='8' fill='#fff' text-anchor='middle' font-weight='bold'>COMBUSTOR</text>
  <text x='363' y='436' font-family='monospace' font-size='8' fill='#fff' text-anchor='middle'>TURBINE</text>
  <text x='456' y='436' font-family='monospace' font-size='8' fill='#fff' text-anchor='middle'>COMP</text>
  <text x='521' y='436' font-family='monospace' font-size='7' fill='#fff' text-anchor='middle'>HRSG</text>

  <!-- η_II summary line -->
  <text x='42' y='462' font-family='monospace' font-size='9' fill='#2a4060'>η_II = 0.502 ± 0.027  (95 % CI 0.450 – 0.554)  ·  balance closure −0.0000  ·  Sobol driver: fuel flow  S_T ≈ 1.1</text>

  <!-- ─── RIGHT PANEL: KPI CONSOLE ─── -->
  <rect x='586' y='60' width='350' height='422' rx='4' fill='#0d1a2e'/>
  <text x='761' y='82' font-family='monospace' font-size='10' fill='#c8d8ea' text-anchor='middle' font-weight='bold'>DESIGN-POINT  ·  CALIBRATED KPIs</text>

  <!-- KPI cell 1: Net power -->
  <rect x='598' y='92' width='154' height='100' rx='3' fill='#081522' stroke='#14304a' stroke-width='1'/>
  <text x='675' y='114' font-family='monospace' font-size='8' fill='#3a6080' text-anchor='middle'>NET COMBINED-CYCLE</text>
  <text x='675' y='156' font-family='monospace' font-size='36' fill='#65d6c9' text-anchor='middle' font-weight='bold'>60.7</text>
  <text x='675' y='178' font-family='monospace' font-size='11' fill='#65d6c9' text-anchor='middle'>MW</text>

  <!-- KPI cell 2: Plant efficiency -->
  <rect x='758' y='92' width='154' height='100' rx='3' fill='#08180e' stroke='#184830' stroke-width='1'/>
  <text x='835' y='114' font-family='monospace' font-size='8' fill='#2a5830' text-anchor='middle'>PLANT EFFICIENCY</text>
  <text x='835' y='156' font-family='monospace' font-size='36' fill='#4ade80' text-anchor='middle' font-weight='bold'>52.8</text>
  <text x='835' y='178' font-family='monospace' font-size='11' fill='#4ade80' text-anchor='middle'>%</text>

  <!-- Separator -->
  <line x1='598' y1='200' x2='924' y2='200' stroke='#122030' stroke-width='1'/>

  <!-- Metric row: η_II -->
  <rect x='598' y='206' width='326' height='48' rx='2' fill='#060e18'/>
  <text x='612' y='226' font-family='monospace' font-size='9' fill='#4a6080'>RATIONAL 2nd-LAW EFFICIENCY  η_II</text>
  <text x='920' y='244' font-family='monospace' font-size='17' fill='#f6c85f' text-anchor='end' font-weight='bold'>0.502 ± 0.027</text>
  <text x='920' y='226' font-family='monospace' font-size='8' fill='#706020' text-anchor='end'>95 % CI  0.450 – 0.554</text>

  <!-- Metric row: Balance closure -->
  <rect x='598' y='258' width='326' height='42' rx='2' fill='#080f1a'/>
  <text x='612' y='276' font-family='monospace' font-size='9' fill='#4a6080'>EXERGY BALANCE CLOSURE</text>
  <text x='920' y='292' font-family='monospace' font-size='17' fill='#4ade80' text-anchor='end' font-weight='bold'>−0.0000</text>
  <text x='920' y='276' font-family='monospace' font-size='8' fill='#2a5830' text-anchor='end'>machine zero</text>

  <!-- Metric row: Sobol -->
  <rect x='598' y='304' width='326' height='42' rx='2' fill='#060e18'/>
  <text x='612' y='322' font-family='monospace' font-size='9' fill='#4a6080'>DOMINANT SOBOL DRIVER  S_T</text>
  <text x='920' y='338' font-family='monospace' font-size='14' fill='#f97316' text-anchor='end'>fuel flow  ≈ 1.1</text>
  <text x='920' y='322' font-family='monospace' font-size='8' fill='#704018' text-anchor='end'>all others ≈ 0</text>

  <!-- Metric row: HRSG stack -->
  <rect x='598' y='350' width='326' height='42' rx='2' fill='#080f1a'/>
  <text x='612' y='368' font-family='monospace' font-size='9' fill='#4a6080'>HRSG PINCH  ·  STACK TEMP</text>
  <text x='920' y='384' font-family='monospace' font-size='14' fill='#38bdf8' text-anchor='end'>15 K  ·  379 K</text>

  <!-- Test badge -->
  <rect x='598' y='396' width='326' height='74' rx='3' fill='#061a10' stroke='#1a5030' stroke-width='1'/>
  <text x='612' y='416' font-family='monospace' font-size='9' fill='#2a7040'>VERIFICATION REGIME  ·  ALL GREEN  ·  RELEASE 7.0</text>
  <text x='761' y='452' font-family='monospace' font-size='28' fill='#4ade80' text-anchor='middle' font-weight='bold'>28 / 28 ✓</text>
  <text x='761' y='468' font-family='monospace' font-size='8' fill='#1a5030' text-anchor='middle'>unit tests + analytic selftest oracle</text>

  <!-- ─── BOTTOM TAG STRIP ─── -->
  <rect x='24' y='490' width='912' height='34' rx='5' fill='#0d1a2e'/>
  <text x='44' y='512' font-family='monospace' font-size='10' fill='#2a4060'>Fortran 2008  ·  NASA-9 gas props  ·  IAPWS-IF97 steam  ·  ε-NTU HRSG  ·  Monte-Carlo UQ  ·  Sobol sensitivity  ·  WLS reconciliation  ·  Win32/GDI+ HMI</text>
</svg>
