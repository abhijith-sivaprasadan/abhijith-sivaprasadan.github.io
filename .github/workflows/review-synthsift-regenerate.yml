name: Review-only SynthSift academic regeneration
on:
  push:
    branches: [review/synthsift-full-corpus-538-20261020]
    paths:
      - .github/workflows/review-synthsift-regenerate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Regenerate HTML from updated source metadata
        run: |
          node scripts/build-academic.cjs
          node scripts/build-academic.cjs --check
          node scripts/validate-academic.cjs
          node scripts/validate-feed-page.cjs
      - name: Keep generated pages and canonical data in sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tracks skills
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate academic dossiers after SynthSift full-corpus status update"
            git push
          fi
