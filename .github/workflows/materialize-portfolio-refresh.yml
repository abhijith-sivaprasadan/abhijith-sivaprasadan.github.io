name: Materialize research portfolio design assets and pages
on:
  push:
    branches: [portfolio-2026-oct-research-reports]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate portfolio artwork and academic pages
        run: |
          node scripts/build-portfolio-art.cjs
          node scripts/build-academic.cjs
      - name: Commit reproducible generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrations/*.svg index.html skills/*.html tracks/*.html
          if git diff --cached --quiet; then
            echo "Generated output already synchronized"
          else
            git commit -m "chore: synchronize generated research project covers"
            git push origin HEAD:portfolio-2026-oct-research-reports
          fi
