name: Build and verify new contribution pages (review)
on:
  push:
    branches: [review/siemens-feed-curated-20261020]
    paths:
      - .github/workflows/review-new-contributions-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/review/siemens-feed-curated-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Generate shared portfolio art and academic pages
        run: |
          node scripts/build-portfolio-art.cjs
          node scripts/build-academic.cjs
      - name: Verify site generation and scientific boundaries
        run: |
          node scripts/validate-static.cjs
          node scripts/build-portfolio-art.cjs --check
          node scripts/build-academic.cjs --check
          node scripts/validate-academic.cjs
          node scripts/validate-unified-ui.cjs
          node scripts/validate-feed-page.cjs
      - name: Check all local HTML links and assets
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),root=process.cwd(); let count=0, checked=0, missing=[];
          function walk(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
            if(['.git','node_modules'].includes(entry.name))continue;
            const file=path.join(dir,entry.name);
            if(entry.isDirectory())walk(file);
            if(entry.isFile()&&file.endsWith('.html')){count++;const html=fs.readFileSync(file,'utf8');
              for(const m of html.matchAll(/\b(?:href|src)=["']([^"']+)["']/g)){
                let value=m[1].split(/[?#]/)[0];if(!value||/^(?:https?:|mailto:|tel:|data:)/i.test(value))continue;
                const target=path.resolve(path.dirname(file),value);checked++;
                if(!target.startsWith(root)||!fs.existsSync(target))missing.push(path.relative(root,file)+' -> '+m[1]);
              }
            }
          }}walk(root); console.log(count+' pages, '+checked+' local refs checked');
          if(missing.length){console.error(missing.join('\n')); process.exit(1)}
          NODE
      - name: Commit regenerated SVG and academic HTML to review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustrations assets/thumb-*.svg index.html tracks skills
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate three new original project covers and academic dossiers"
            git push
          fi
