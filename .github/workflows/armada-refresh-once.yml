name: One-time Armada portfolio generated-page refresh
on:
  push:
    branches:
      - feat/armada-2026-employer-portfolio
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/armada-2026-employer-portfolio
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate controlled vector covers and track/skill pages
        run: |
          node scripts/build-portfolio-art.cjs
          node scripts/build-academic.cjs
          node scripts/build-portfolio-art.cjs --check
          node scripts/build-academic.cjs --check
      - name: Commit updated generated pages only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracks/ skills/ assets/illustrations/
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate project evidence tracks for CarnotBatteryLab"
            git push origin HEAD:feat/armada-2026-employer-portfolio
          fi
